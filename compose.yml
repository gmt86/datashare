# compose.yml — DataShare Monorepo
# Lance l'ensemble de l'application : PostgreSQL + Backend + Frontend

services:

  # Base de données PostgreSQL
  postgres:
    image: postgres:15
    container_name: datashare-db
    environment:
      POSTGRES_DB: datashare
      POSTGRES_USER: datashare_user
      POSTGRES_PASSWORD: datashare_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashare_user -d datashare"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datashare-backend
    environment:
      POSTGRES_HOST: postgres  
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/fichiers:/app/fichiers

  # Frontend Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datashare-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
