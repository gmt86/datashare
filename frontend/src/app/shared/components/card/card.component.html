<!-- Card générique DataShare -->
<div class="page-container">
  <div class="card">

    <!-- Titre -->
    @if (isMainTitle) 
    {
     <h1>{{ title }}</h1>
    } @else {
      <h2>{{ title }}</h2>
    }

    <!-- Message d'erreur global -->
    @if (errorMessage) {
      <div class="error-callout">{{ errorMessage }}</div>
    }

    <!-- Contenu projeté -->
    <ng-content />

  </div>
</div>
