services:
  # BDD développement
  postgres:
    image: postgres:15
    container_name: datashare-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # BDD tests — séparée et isolée
  postgres-test:
    image: postgres:15
    container_name: datashare-db-test
    environment:
      POSTGRES_DB: datashare_test
      POSTGRES_USER: datashare_user
      POSTGRES_PASSWORD: datashare_password
    ports:
      - "5433:5432"  # port différent pour éviter les conflits
    tmpfs:
      - /var/lib/postgresql/data  # données en mémoire — reset à chaque arrêt

volumes:
  postgres_data: